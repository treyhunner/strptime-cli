[build-system]
requires = ["hatchling>=1.26.1"]
build-backend = "hatchling.build"

[project]
name = "strptime-cli"
version = "0.5.0"
description = "Guess the strptime format string that matches a given date string"
readme = "README.md"
requires-python = ">=3.9"
license = "MIT"
keywords = ["datetime", "strptime", "strftime", "cli"]
authors = [
  { name = "Trey Hunner" },
]
classifiers = [
  "Development Status :: 4 - Beta",
  "Programming Language :: Python",
  "Programming Language :: Python :: 3.9",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
  "Programming Language :: Python :: Implementation :: CPython",
  "Programming Language :: Python :: Implementation :: PyPy",
]
dependencies = [
    "textual",
    "pyperclip",
    "platformdirs",
    "darkdetect",
]

[project.urls]
Documentation = "https://github.com/treyhunner/strptime-cli#readme"
Issues = "https://github.com/treyhunner/strptime-cli/issues"
Source = "https://github.com/treyhunner/strptime-cli"

[project.scripts]
strptime = "strptime:main"

[dependency-groups]
dev = [
    "pytest>=8.0.0",
    "pytest-cov>=5.0.0",
    "ruff>=0.14.0",
    "textual-dev>=1.7.0",
]

[tool.hatch.build.targets.wheel]
only-include = ["strptime.py"]

[tool.hatch.build.targets.sdist]
only-include = ["strptime.py", "tests.py", "README.md"]

[tool.pytest.ini_options]
python_files = ["tests.py", "test_*.py", "*_test.py"]

[tool.ruff]
target-version = "py39"

[tool.ruff.lint]
select = [
    "E",      # pycodestyle errors
    "W",      # pycodestyle warnings
    "F",      # pyflakes
    "I",      # isort
    "UP",     # pyupgrade
    "B",      # flake8-bugbear
    "C4",     # flake8-comprehensions
]
ignore = [
    "E501",   # line too long (handled by formatter)
]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[tool.coverage.run]
source = ["strptime", "tests"]
branch = true

[tool.coverage.report]
exclude_lines = [
  "no cov",
  "if __name__ == .__main__.:",
]
